[workspace]
members = [
    "crates/stack-cli",
    "crates/stack-core",
    "crates/stack-install",
    "crates/stack-platform",
    "crates/stack-runtime",
    "crates/stack-schema",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rustix = { version = "1.1", features = ["fs"] }
tar = "0.4.46"
tempfile = "3.10"
thiserror = "2.0"
toml = "0.8"
