name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fedora quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: registry.fedoraproject.org/fedora@sha256:2f642b05977b30ec43dacb7a6706f3204a861d4a0d8f72cff734f111801ad461 # Fedora44 amd64
      options: --cpus 4
    env:
      CARGO_HOME: /opt/ci-cargo
      RUSTUP_HOME: /opt/ci-rustup
      RUSTUP_TOOLCHAIN: 1.85.0
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 2
    steps:
      - name: Bootstrap Git for a real repository checkout
        run: dnf5 --assumeyes --setopt=install_weak_deps=False install git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Fedora test tools
        run: bash scripts/ci/install-fedora-tools.sh
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Run quality gate as unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          chown -R ci:ci "$CARGO_HOME" "$RUSTUP_HOME" "$GITHUB_WORKSPACE"
          runuser -u ci -- env PATH="$CARGO_HOME/bin:$PATH" \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" RUSTUP_TOOLCHAIN=1.85.0 \
            bash scripts/ci/quality.sh 2>&1 | tee quality.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fedora-quality-log
          path: quality.log
          if-no-files-found: ignore
          retention-days: 14

  native:
    name: Native SDK and C++ CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake ninja-build g++ git python3 libnuma1
      - name: Prepare hash-pinned CI SDK
        run: python3 scripts/ci/prepare_native_sdk.py --output "$RUNNER_TEMP/native-sdk" --cache "$RUNNER_TEMP/sdk-downloads" --jobs 4
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: c-cpp
          build-mode: manual
          config-file: .github/codeql/config.yml
      - name: Build, test, and inspect native helpers
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/native-build"
          ./scripts/check-native.sh "$RUNNER_TEMP/native-sdk" "$RUNNER_TEMP/native-build" 2>&1 | tee native.log
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:c-cpp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-sdk-evidence
          path: |
            native.log
            ${{ runner.temp }}/native-sdk/sdk-record.json
            ${{ runner.temp }}/native-build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/config.yml
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}

  dco:
    name: DCO sign-off
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lint GitHub Actions workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --disable --fail --location --proto '=https' --proto-redir '=https' \
            --max-time 120 --max-filesize 16777216 --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Check author sign-offs in the actual contribution range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/check_contributions.py --base "$BASE_SHA" --head "$HEAD_SHA"

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  gate:
    name: CI gate
    if: always()
    needs: [quality, native, dco, dependencies, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every applicable job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_gate.py
