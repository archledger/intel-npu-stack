name: Prepare candidate

# Separately permissioned manual operation (design §9): turns one validated
# upstream-update watcher finding into an unqualified candidate pin update and
# a DRAFT pull request. It cannot alter qualified profiles, approve workflows,
# merge, sign, or publish. Upstream data is untrusted and only ever passed as
# argv/file content.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Open upstream-update issue number to prepare from'
        required: true

permissions:
  contents: write # push one candidate branch
  pull-requests: write # open one draft PR
  issues: read # read the selected watcher finding

concurrency:
  group: prepare-candidate
  cancel-in-progress: false

jobs:
  prepare:
    name: Re-pin one validated finding
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ inputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the selected watcher issue
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "issue input must be a number" >&2; exit 2; }
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json state,labels,title,body > issue.json
          state=$(jq -r .state issue.json)
          labels=$(jq -r '[.labels[].name] | join(",")' issue.json)
          [[ "${state,,}" == "open" ]] || { echo "issue $ISSUE is not open (state: $state)" >&2; exit 2; }
          [[ "$labels" == *upstream-update* ]] || { echo "issue $ISSUE lacks the upstream-update label" >&2; exit 2; }
          jq -r .title issue.json > issue-title.txt
          jq -r .body issue.json > issue-body.md
      - name: Re-resolve the upstream tag against retagging
        run: |
          set -euo pipefail
          repository=$(sed -E 's/.*upstream:([^:]+):([^:]+)$/\1/' issue-title.txt)
          tag=$(sed -E 's/.*upstream:([^:]+):([^:]+)$/\2/' issue-title.txt)
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "malformed repository in issue key" >&2; exit 2; }
          [[ "$tag" != */* && "$tag" != *[' ']* ]] || { echo "unsupported tag shape: $tag" >&2; exit 2; }
          ref=$(gh api "repos/$repository/git/ref/tags/$tag")
          object_type=$(printf '%s' "$ref" | jq -r .object.type)
          object_sha=$(printf '%s' "$ref" | jq -r .object.sha)
          tag_object="null"
          if [[ "$object_type" == "tag" ]]; then
            tag_object="$object_sha"
            object_sha=$(gh api "repos/$repository/git/tags/$tag_object" | jq -r .object.sha)
          fi
          jq -n --arg commit "$object_sha" --arg tag_object "$tag_object" \
            '{commit: $commit, tag_object: (if $tag_object == "null" then null else $tag_object end)}' > resolved.json
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.85.0
      - name: Produce and validate the pin update
        run: |
          set -euo pipefail
          python3 scripts/ci/prepare_candidate.py \
            --issue-title "$(cat issue-title.txt)" \
            --issue-body "$(cat issue-body.md)" \
            --resolved-tag resolved.json \
            --output updated.toml
          if [[ ! -f updated.toml ]]; then
            echo "Lock already current; nothing to prepare."
            echo "prepared=false" >> "$GITHUB_ENV"
            exit 0
          fi
          cargo fetch --locked
          cargo run -p xtask --locked --offline -- validate-source-lock --path updated.toml
          echo "prepared=true" >> "$GITHUB_ENV"
      - name: Push the candidate branch and open a draft PR
        if: env.prepared == 'true'
        run: |
          set -euo pipefail
          component=$(PYTHONPATH=scripts/ci python3 -c \
            'import sys; from pathlib import Path; from prepare_candidate import finding_from_issue; \
             print(finding_from_issue(Path("issue-title.txt").read_text(), Path("issue-body.md").read_text())["component"])')
          tag=$(sed -E 's/.*upstream:([^:]+):([^:]+)$/\2/' issue-title.txt)
          branch="candidate/${component}-${tag}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "branch $branch already exists; refusing to overwrite" >&2
            exit 2
          fi
          existing=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          [[ "$existing" == "0" ]] || { echo "an open PR already exists for $branch" >&2; exit 2; }
          git switch -c "$branch"
          cp updated.toml packaging/fedora/44/provider-sources.toml
          git add packaging/fedora/44/provider-sources.toml
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "candidate: re-pin ${component} to ${tag}" \
              -m "Unqualified candidate pin update generated from upstream-update issue #${ISSUE}. Provider RPMs are not rebuilt by this change.

          Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git push origin "$branch"
          jq -n --arg component "$component" --arg tag "$tag" --arg issue "$ISSUE" \
            '## Candidate pin update\n\nRe-pins \($component) to \($tag) from watcher issue #\($issue).\n\nThis draft changes source pin metadata only. It does NOT rebuild provider RPMs, does not bind or alter any profile, and does not qualify anything.\n\nMaintainer checklist before merge:\n- Review upstream license changes against the recorded license evidence; update evidence if upstream notices changed.\n- Rebuild provider RPMs offline and produce fresh reproducibility evidence.\n- Regenerate the candidate profile from the new RPM evidence.\n- All qualification gates apply unchanged.\n\nRefs #\($issue)' > pr-body.md
          gh pr create --draft --base main --head "$branch" \
            --title "candidate: re-pin ${component} to ${tag}" \
            --body-file pr-body.md
